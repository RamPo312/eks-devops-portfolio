apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-devops-app
  template:
    metadata:
      labels:
        app: eks-devops-app
    spec:
      containers:
        - name: eks-devops-app
          image: rampo3/eks-devops-app:v1
          ports:
            - containerPort: 5000
